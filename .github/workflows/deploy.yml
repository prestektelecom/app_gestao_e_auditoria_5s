# Publica no servidor da empresa a cada push na main (ou manualmente em Actions → Deploy → Run workflow).
# Só publica se a verificação de tipos e os testes passarem.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SSH_HOST  endereço do servidor            SSH_USER  usuário do SSH
#   SSH_KEY   chave privada do SSH            SSH_PORT  porta (opcional, padrão 22)
#   APP_DIR   pasta do app no servidor        PM2_APP   nome do app no pm2
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      configured: ${{ steps.cfg.outputs.configured }}
    steps:
      - id: cfg
        name: Conferir se os segredos do servidor existem
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then echo "configured=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::Segredos do servidor não configurados: a publicação será pulada."; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keyscan -T 20 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Não consegui alcançar o servidor $SSH_HOST na porta $SSH_PORT. Confira o SSH_HOST (IP público), a porta e se o firewall libera o SSH vindo da internet."
            exit 1
          fi

      - name: Testar o acesso SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if ! ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" true; then
            echo "::error::O servidor respondeu, mas recusou o login de $SSH_USER com a chave. Confira o SSH_USER, o SSH_KEY (texto completo, do BEGIN ao END) e se a chave pública está em /home/$SSH_USER/.ssh/authorized_keys."
            exit 1
          fi

      - name: Atualizar o servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR }}
          PM2_APP: ${{ secrets.PM2_APP }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$APP_DIR' && git pull --ff-only && PM2_APP='$PM2_APP' bash scripts/deploy.sh"
